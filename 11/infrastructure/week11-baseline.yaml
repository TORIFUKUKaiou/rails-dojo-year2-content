AWSTemplateFormatVersion: '2010-09-09'
Description: Rails Dojo Week 11 baseline - VPC and one Ubuntu EC2 instance for manual ALB practice

Parameters:
  UbuntuAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/26.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Ubuntu Server 26.04 LTS AMI ID from the Canonical public SSM parameter

Resources:
  RailsDojoVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: rails-dojo-week11-vpc

  RailsDojoInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: rails-dojo-week11-igw

  RailsDojoVpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref RailsDojoVpc
      InternetGatewayId: !Ref RailsDojoInternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref RailsDojoVpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: rails-dojo-week11-public-subnet-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref RailsDojoVpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: rails-dojo-week11-public-subnet-2

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref RailsDojoVpc
      Tags:
        - Key: Name
          Value: rails-dojo-week11-public-route-table

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: RailsDojoVpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref RailsDojoInternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  RailsDojoEc2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Rails Dojo Week 11 EC2
      VpcId: !Ref RailsDojoVpc
      Tags:
        - Key: Name
          Value: rails-dojo-week11-ec2-sg

  RailsDojoEc2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.medium
      ImageId: !Ref UbuntuAmiId
      SubnetId: !Ref PublicSubnet1
      SecurityGroupIds:
        - !Ref RailsDojoEc2SecurityGroup
      IamInstanceProfile: LabInstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 16
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: rails-dojo-week11
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail

          mkdir -p /opt/rails-dojo
          echo "setup started at $(date -Is)" > /opt/rails-dojo/setup-status

          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git \
            curl \
            build-essential \
            autoconf \
            libssl-dev \
            libyaml-dev \
            zlib1g-dev \
            libffi-dev \
            libgmp-dev \
            libreadline-dev \
            rustc \
            libsqlite3-dev \
            sqlite3 \
            pkg-config \
            snapd

          if command -v snap >/dev/null 2>&1; then
            snap install amazon-ssm-agent --classic || true
            systemctl enable snap.amazon-ssm-agent.amazon-ssm-agent.service || true
            systemctl restart snap.amazon-ssm-agent.amazon-ssm-agent.service || true
          fi

          sudo -iu ubuntu bash <<'USER_SCRIPT'
          set -euxo pipefail

          export MISE_YES=1
          curl https://mise.run | sh
          grep -q 'mise activate bash' ~/.bashrc || echo 'eval "$($HOME/.local/bin/mise activate bash)"' >> ~/.bashrc
          export PATH="$HOME/.local/bin:$PATH"
          MISE="$HOME/.local/bin/mise"
          "$MISE" settings ruby.compile=false
          "$MISE" use -g ruby@4.0.2
          "$MISE" exec ruby@4.0.2 -- ruby -v
          "$MISE" exec ruby@4.0.2 -- gem install bundler -v 4.0.6
          "$MISE" exec ruby@4.0.2 -- bundle -v
          git --version
          sqlite3 --version
          USER_SCRIPT

          touch /opt/rails-dojo/setup-complete
          echo "setup complete at $(date -Is)" >> /opt/rails-dojo/setup-status

Outputs:
  VpcId:
    Description: VPC ID for Week 11
    Value: !Ref RailsDojoVpc

  PublicSubnet1:
    Description: First public subnet ID for ALB
    Value: !Ref PublicSubnet1

  PublicSubnet2:
    Description: Second public subnet ID for ALB
    Value: !Ref PublicSubnet2

  EC2InstanceId:
    Description: EC2 instance ID for Rails
    Value: !Ref RailsDojoEc2Instance

  EC2PublicIp:
    Description: Public IPv4 address of the Rails EC2 instance
    Value: !GetAtt RailsDojoEc2Instance.PublicIp

  EC2SecurityGroupId:
    Description: Security group ID attached to the Rails EC2 instance
    Value: !Ref RailsDojoEc2SecurityGroup
